<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<title>配置决策端 · Themis Tally</title>
<script src="06f0c062-ae90-49b7-aa18-4505cee00976"></script>
<style>/* Themis Tally 设计令牌（tokens.css）
   依据《Themis Tally 桌面端界面设计》第 3 节；2026-10-19 修订：
   - 缺省主题为暗色（亮色写 data-theme="light" 或 .tt-theme-light；跟随系统写 data-theme="system"）；
   - 中英文统一用等宽字体「等距更纱黑体 SC / Sarasa Mono SC」（SIL OFL 1.1），1 个汉字 = 2 个英文字符宽。
   画布里用的是只含本稿用字的子集；应用里随包打包完整字体文件。 */

@font-face {
  font-family: "TT Sarasa Mono SC";
  src: url("a2a50a2f-43a5-4ecf-9191-a31c355fa2ab") format("woff2");
  font-weight: 300 500;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "TT Sarasa Mono SC";
  src: url("c333d3e6-5da3-4e5f-ba13-4cad874bed63") format("woff2");
  font-weight: 600 800;
  font-style: normal;
  font-display: swap;
}

:root {
  /* 3.1 原色 · 海军蓝 */
  --tt-navy-50: #F0F4FA; --tt-navy-100: #DDE6F2; --tt-navy-200: #BACCE4; --tt-navy-300: #8FA9CF;
  --tt-navy-400: #5C80B4; --tt-navy-500: #355E97; --tt-navy-600: #1E4679; --tt-navy-700: #0F3563;
  --tt-navy-800: #012852; --tt-navy-900: #011D3D; --tt-navy-950: #00112A;
  /* 符契金 */
  --tt-gold-50: #FCF7EC; --tt-gold-100: #F8EBD0; --tt-gold-200: #F0D6A0; --tt-gold-300: #E7BF6E;
  --tt-gold-400: #DDAA48; --tt-gold-500: #D49C32; --tt-gold-600: #B5801F; --tt-gold-700: #8E6418;
  --tt-gold-800: #694A13; --tt-gold-900: #46320E;
  /* 冷灰 */
  --tt-gray-0: #FFFFFF; --tt-gray-25: #F9FAFC; --tt-gray-50: #F3F5F9; --tt-gray-100: #E8ECF2;
  --tt-gray-200: #D5DBE5; --tt-gray-300: #B7C0CE; --tt-gray-400: #8F9AAD; --tt-gray-500: #6A7589;
  --tt-gray-600: #4F596C; --tt-gray-700: #3A4354; --tt-gray-800: #262E3C; --tt-gray-850: #1C2330;
  --tt-gray-900: #141A25; --tt-gray-950: #0C111A;

  /* 3.6 字体：中英文统一等宽 */
  --tt-font-sans: "TT Sarasa Mono SC", "Sarasa Mono SC", "等距更纱黑体 SC", "Sarasa Term SC", "Maple Mono NF CN", "Cascadia Mono", "Noto Sans Mono CJK SC", monospace;
  --tt-font-mono: var(--tt-font-sans);
  --tt-text-caption: 400 12px/16px var(--tt-font-sans);
  --tt-text-caption-strong: 600 12px/16px var(--tt-font-sans);
  --tt-text-sm: 400 13px/20px var(--tt-font-sans);
  --tt-text-sm-medium: 500 13px/20px var(--tt-font-sans);
  --tt-text-md: 400 14px/22px var(--tt-font-sans);
  --tt-text-md-medium: 500 14px/22px var(--tt-font-sans);
  --tt-text-lg: 400 16px/24px var(--tt-font-sans);
  --tt-title-sm: 600 14px/22px var(--tt-font-sans);
  --tt-title-md: 600 16px/24px var(--tt-font-sans);
  --tt-title-lg: 600 20px/28px var(--tt-font-sans);
  --tt-display: 600 28px/36px var(--tt-font-sans);
  --tt-mono-sm: 400 12px/18px var(--tt-font-mono);
  --tt-mono-md: 400 13px/20px var(--tt-font-mono);

  /* 3.7 间距 */
  --tt-space-0_5: 2px; --tt-space-1: 4px; --tt-space-2: 8px; --tt-space-3: 12px; --tt-space-4: 16px;
  --tt-space-5: 20px; --tt-space-6: 24px; --tt-space-8: 32px; --tt-space-10: 40px; --tt-space-12: 48px; --tt-space-16: 64px;
  /* 圆角 */
  --tt-radius-sm: 4px; --tt-radius-md: 6px; --tt-radius-lg: 8px; --tt-radius-xl: 12px; --tt-radius-full: 999px;
  /* 时长与缓动 */
  --tt-duration-fast: 100ms; --tt-duration-base: 160ms; --tt-duration-slow: 220ms;
  --tt-ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --tt-ease-exit: cubic-bezier(0.4, 0, 1, 1);
  /* 层级 */
  --tt-z-sticky: 10; --tt-z-popover: 100; --tt-z-drawer: 200; --tt-z-dialog: 300; --tt-z-toast: 400; --tt-z-tooltip: 500;
  /* 框架：底部标签栏 */
  --tt-tabbar-height: 56px;
}

/* 3.2 / 3.3 语义色 · 暗色（缺省） */
:root, .tt-theme-dark {
  color-scheme: dark;
  --tt-bg: #0C111A;
  --tt-surface-1: #141A25;
  --tt-surface-2: #1C2330;
  --tt-surface-3: #262E3C;
  --tt-surface-selected: #0F2A4D;
  --tt-titlebar: #141A25;
  --tt-sidebar: #00112A;
  --tt-sidebar-hover: #0F2A4D;
  --tt-sidebar-text: #DDE6F2;
  --tt-sidebar-text-muted: #8FA9CF;
  --tt-sidebar-text-active: #FFFFFF;
  --tt-sidebar-dot-info: #67E8F9;
  --tt-text-1: #E8ECF2;
  --tt-text-2: #B7C0CE;
  --tt-text-3: #8F9AAD;
  --tt-text-disabled: #5A6478;
  --tt-border: #262E3C;
  --tt-border-strong: #677186;
  --tt-primary: #8FA9CF;
  --tt-primary-hover: #BACCE4;
  --tt-primary-active: #DDE6F2;
  --tt-on-primary: #00112A;
  --tt-link: #8FA9CF;
  --tt-accent: #DDAA48;
  --tt-accent-text: #E7BF6E;
  --tt-on-accent: #00112A;
  --tt-focus: #DDAA48;
  --tt-danger: #B91C1C;
  --tt-on-danger: #FFFFFF;
  --tt-danger-text: #FCA5A5;
  --tt-diff-add: #12301F;
  --tt-diff-del: #3A1414;
  --tt-highlight: #3A2C10;
  --tt-scrim: rgba(0, 0, 0, 0.60);
  --tt-shadow-1: 0 1px 2px rgba(0, 0, 0, .40);
  --tt-shadow-2: 0 4px 12px rgba(0, 0, 0, .50);
  --tt-shadow-3: 0 16px 40px rgba(0, 0, 0, .60);
  --tt-logo-mark: #DDE6F2;
  --tt-logo-tally: #D49C32;
  --tt-tone-neutral-bg: #262E3C;   --tt-tone-neutral-fg: #D5DBE5;
  --tt-tone-info-bg: #0F2E38;      --tt-tone-info-fg: #67E8F9;
  --tt-tone-attention-bg: #3A2C10; --tt-tone-attention-fg: #F0D6A0;
  --tt-tone-success-bg: #12301F;   --tt-tone-success-fg: #86EFAC;
  --tt-tone-warning-bg: #3B1D0C;   --tt-tone-warning-fg: #FDBA74;
  --tt-tone-danger-bg: #3A1414;    --tt-tone-danger-fg: #FCA5A5;
  --tt-tone-escalate-bg: #2A1B4A;  --tt-tone-escalate-fg: #C4B5FD;
  --tt-tone-brand-bg: #0F2A4D;     --tt-tone-brand-fg: #BACCE4;
}

/* 亮色 */
:root[data-theme="light"], .tt-theme-light {
  color-scheme: light;
  --tt-bg: #F3F5F9;
  --tt-surface-1: #FFFFFF;
  --tt-surface-2: #F9FAFC;
  --tt-surface-3: #E8ECF2;
  --tt-surface-selected: #F0F4FA;
  --tt-titlebar: #FFFFFF;
  --tt-sidebar: #012852;
  --tt-sidebar-hover: #0F3563;
  --tt-sidebar-text: #DDE6F2;
  --tt-sidebar-text-muted: #8FA9CF;
  --tt-sidebar-text-active: #FFFFFF;
  --tt-sidebar-dot-info: #67E8F9;
  --tt-text-1: #141A25;
  --tt-text-2: #4F596C;
  --tt-text-3: #636E82;
  --tt-text-disabled: #8F9AAD;
  --tt-border: #D5DBE5;
  --tt-border-strong: #808B9E;
  --tt-primary: #012852;
  --tt-primary-hover: #0F3563;
  --tt-primary-active: #011D3D;
  --tt-on-primary: #FFFFFF;
  --tt-link: #1E4679;
  --tt-accent: #D49C32;
  --tt-accent-text: #8E6418;
  --tt-on-accent: #00112A;
  --tt-focus: #355E97;
  --tt-danger: #B91C1C;
  --tt-on-danger: #FFFFFF;
  --tt-danger-text: #991B1B;
  --tt-diff-add: #E3F4E8;
  --tt-diff-del: #FCE4E4;
  --tt-highlight: #F8EBD0;
  --tt-scrim: rgba(12, 17, 26, 0.45);
  --tt-shadow-1: 0 1px 2px rgba(1, 40, 82, .06);
  --tt-shadow-2: 0 4px 12px rgba(1, 40, 82, .10), 0 1px 3px rgba(1, 40, 82, .06);
  --tt-shadow-3: 0 16px 40px rgba(1, 40, 82, .18);
  --tt-logo-mark: #012852;
  --tt-logo-tally: #D49C32;
  --tt-tone-neutral-bg: #E8ECF2;   --tt-tone-neutral-fg: #3A4354;
  --tt-tone-info-bg: #DDF1F5;      --tt-tone-info-fg: #0B5566;
  --tt-tone-attention-bg: #F8EBD0; --tt-tone-attention-fg: #5E420F;
  --tt-tone-success-bg: #E3F4E8;   --tt-tone-success-fg: #136A34;
  --tt-tone-warning-bg: #FDEBDD;   --tt-tone-warning-fg: #9A3412;
  --tt-tone-danger-bg: #FCE4E4;    --tt-tone-danger-fg: #991B1B;
  --tt-tone-escalate-bg: #EFE7FD;  --tt-tone-escalate-fg: #5B21B6;
  --tt-tone-brand-bg: #DDE6F2;     --tt-tone-brand-fg: #012852;
}

/* 跟随系统：写 data-theme="system" 时，系统为亮色就用亮色 */
@media (prefers-color-scheme: light) {
  :root[data-theme="system"] {
    color-scheme: light;
    --tt-bg: #F3F5F9; --tt-surface-1: #FFFFFF; --tt-surface-2: #F9FAFC; --tt-surface-3: #E8ECF2;
    --tt-surface-selected: #F0F4FA; --tt-titlebar: #FFFFFF; --tt-sidebar: #012852; --tt-sidebar-hover: #0F3563;
    --tt-text-1: #141A25; --tt-text-2: #4F596C; --tt-text-3: #636E82; --tt-text-disabled: #8F9AAD;
    --tt-border: #D5DBE5; --tt-border-strong: #808B9E;
    --tt-primary: #012852; --tt-primary-hover: #0F3563; --tt-primary-active: #011D3D; --tt-on-primary: #FFFFFF;
    --tt-link: #1E4679; --tt-accent: #D49C32; --tt-accent-text: #8E6418; --tt-focus: #355E97;
    --tt-danger-text: #991B1B; --tt-diff-add: #E3F4E8; --tt-diff-del: #FCE4E4; --tt-highlight: #F8EBD0;
    --tt-scrim: rgba(12, 17, 26, 0.45);
    --tt-shadow-1: 0 1px 2px rgba(1, 40, 82, .06); --tt-shadow-2: 0 4px 12px rgba(1, 40, 82, .10), 0 1px 3px rgba(1, 40, 82, .06); --tt-shadow-3: 0 16px 40px rgba(1, 40, 82, .18);
    --tt-logo-mark: #012852;
    --tt-tone-neutral-bg: #E8ECF2; --tt-tone-neutral-fg: #3A4354; --tt-tone-info-bg: #DDF1F5; --tt-tone-info-fg: #0B5566;
    --tt-tone-attention-bg: #F8EBD0; --tt-tone-attention-fg: #5E420F; --tt-tone-success-bg: #E3F4E8; --tt-tone-success-fg: #136A34;
    --tt-tone-warning-bg: #FDEBDD; --tt-tone-warning-fg: #9A3412; --tt-tone-danger-bg: #FCE4E4; --tt-tone-danger-fg: #991B1B;
    --tt-tone-escalate-bg: #EFE7FD; --tt-tone-escalate-fg: #5B21B6; --tt-tone-brand-bg: #DDE6F2; --tt-tone-brand-fg: #012852;
  }
}

/* 减少动态效果 */
@media (prefers-reduced-motion: reduce) {
  :root { --tt-duration-fast: 0ms; --tt-duration-base: 0ms; --tt-duration-slow: 0ms; }
}

/* ---------- 基础 ---------- */
.tt-app {
  font: var(--tt-text-md);
  color: var(--tt-text-1);
  background: var(--tt-bg);
  -webkit-font-smoothing: antialiased;
  font-variant-ligatures: none;
}
.tt-app *, .tt-app *::before, .tt-app *::after { box-sizing: border-box; }
.tt-app button, .tt-app input, .tt-app select, .tt-app textarea { font: inherit; color: inherit; margin: 0; }
.tt-app button { cursor: pointer; }
.tt-app button:disabled { cursor: not-allowed; }
.tt-app a { color: var(--tt-link); }
.tt-app table { border-collapse: collapse; border-spacing: 0; }
.tt-app input::placeholder { color: var(--tt-text-3); }
.tt-num { font-variant-numeric: tabular-nums; }
.tt-i { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* 焦点：2px 焦点环，外偏 2px（:focus-visible） */
.tt-app :focus-visible { outline: 2px solid var(--tt-focus); outline-offset: 2px; }
.tt-app input:focus-visible, .tt-app select:focus-visible, .tt-app textarea:focus-visible { border-color: var(--tt-focus) !important; outline-offset: 1px; }

/* 悬停与按下（内联样式之上，需 !important） */
.tt-h-primary:hover:not(:disabled) { background: var(--tt-primary-hover) !important; }
.tt-h-primary:active:not(:disabled) { background: var(--tt-primary-active) !important; }
.tt-h-secondary:hover:not(:disabled) { background: var(--tt-surface-2) !important; }
.tt-h-secondary:active:not(:disabled) { background: var(--tt-surface-3) !important; }
.tt-h-ghost:hover:not(:disabled) { background: var(--tt-surface-3) !important; }
.tt-h-danger:hover:not(:disabled) { filter: brightness(0.9); }
.tt-h-nav:hover { background: var(--tt-sidebar-hover) !important; }
.tt-h-row:hover { background: var(--tt-surface-3) !important; }
.tt-h-underline:hover { text-decoration: underline !important; }

/* 动效：只用于状态变化与展开收起 */
@keyframes tt-spin { to { transform: rotate(360deg); } }
.tt-spin { animation: tt-spin 1s linear infinite; transform-origin: 50% 50%; }
@keyframes tt-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
.tt-skel { animation: tt-pulse 1.6s var(--tt-ease-standard) infinite; }
@keyframes tt-indeterminate { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
.tt-indet { animation: tt-indeterminate 1.4s var(--tt-ease-standard) infinite; }
@keyframes tt-enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.tt-enter { animation: tt-enter var(--tt-duration-slow) var(--tt-ease-standard); }
@keyframes tt-drawer-in { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.tt-drawer-in { animation: tt-drawer-in var(--tt-duration-slow) var(--tt-ease-standard); }
@media (prefers-reduced-motion: reduce) {
  .tt-spin, .tt-skel, .tt-indet, .tt-enter, .tt-drawer-in { animation: none; }
}

/* 窄内容区（内容宽度 < 760）：容器查询，不用视口宽度 */
.tt-content { container-type: inline-size; container-name: tt-content; }
@container tt-content (max-width: 807px) {
  .tt-pad { padding: 16px !important; }
  .tt-grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .tt-grid-2 { grid-template-columns: minmax(0, 1fr) !important; }
  .tt-stack-narrow { flex-direction: column !important; align-items: stretch !important; }
  .tt-w-narrow-full { width: auto !important; flex: none !important; }
}
/* 底部标签栏在窄窗口（< 1180）时只保留计数，隐藏“上次更新”与 kit 版本 */
@media (max-width: 1179px) {
  .tt-hide-narrow { display: none !important; }
}

/* Windows 高对比度 */
@media (forced-colors: active) {
  .tt-app :focus-visible { outline-color: Highlight; }
  .tt-fc { border: 1px solid CanvasText !important; }
}
</style>
</head>

<button type="button" role="radio" aria-checked="{{ on }}" sc-camel-on-click="{{ setOn }}" style="height: 28px; padding: 0 14px; border: 0; border-radius: var(--tt-radius-sm); background: {{ onBg }}; box-shadow: {{ onSh }}; color: var(--tt-text-1); font: var(--tt-text-sm-medium)">启用</button>
</div>
<span style="font: var(--tt-text-caption); color: var(--tt-text-3)">启用后由协调人在一审、终审之前调用；凭据缺失、超时或出错时当作未调用，直接移交审核端。</span>
</div>
<sc-if value="{{ on }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font: var(--tt-title-sm)">接口地址</span><input type="text" value="https://jev.example.com/v1/judge" spellcheck="false" style="height: 32px; padding: 0 10px; border: 1px solid var(--tt-border-strong); border-radius: var(--tt-radius-md); background: var(--tt-surface-1); color: var(--tt-text-1); font: var(--tt-mono-md)"><span style="font: var(--tt-text-caption); color: var(--tt-text-3)">决策端是独立的 API，不走 CLI runtime。</span></label>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font: var(--tt-title-sm)">凭据变量</span><input type="text" value="TYPESAFE_API_KEY" spellcheck="false" style="height: 32px; padding: 0 10px; border: 1px solid var(--tt-border-strong); border-radius: var(--tt-radius-md); background: var(--tt-surface-1); color: var(--tt-text-1); font: var(--tt-mono-md)"><span style="font: var(--tt-text-caption); color: var(--tt-text-3)">只写变量名；值在「凭据」页录入，这个界面拿不到值。</span></label>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font: var(--tt-title-sm)">调用点</span><label style="display: flex; align-items: flex-start; gap: 8px; font: var(--tt-text-sm); cursor: pointer"><input type="checkbox" checked="{{ c1 }}" sc-camel-on-change="{{ toggle_c1 }}" style="width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--tt-primary)"><span style="display: flex; flex-direction: column"><span>合同级 · 一审之前</span><span style="font: var(--tt-text-caption); color: var(--tt-text-3)">看合同概述（交付信的四个标准字段）与原始目标</span></span></label><label style="display: flex; align-items: flex-start; gap: 8px; font: var(--tt-text-sm); cursor: pointer"><input type="checkbox" checked="{{ c2 }}" sc-camel-on-change="{{ toggle_c2 }}" style="width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--tt-primary)"><span style="display: flex; flex-direction: column"><span>执行级 · 终审之前</span><span style="font: var(--tt-text-caption); color: var(--tt-text-3)">看执行结果概述、门禁报告与原始目标</span></span></label></div>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 12px"><label style="display: flex; flex-direction: column; gap: 6px"><span style="font: var(--tt-title-sm)">筛查题库</span><input type="text" value=".agent/jev/screening.md" spellcheck="false" style="height: 32px; padding: 0 10px; border: 1px solid var(--tt-border-strong); border-radius: var(--tt-radius-md); background: var(--tt-surface-1); color: var(--tt-text-1); font: var(--tt-mono-md)"><span style="font: var(--tt-text-caption); color: var(--tt-text-3)">裁决时对照的题库，只读。</span></label><label style="display: flex; flex-direction: column; gap: 6px"><span style="font: var(--tt-title-sm)">超时（秒）</span><input type="text" value="60" inputmode="numeric" style="height: 32px; padding: 0 10px; border: 1px solid var(--tt-border-strong); border-radius: var(--tt-radius-md); background: var(--tt-surface-1); color: var(--tt-text-1); font: var(--tt-mono-md)"></label></div>
</div>
</sc-if>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--tt-radius-lg); background: var(--tt-surface-2); border: 1px solid var(--tt-border)">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font: var(--tt-title-sm)">{{ previewTitle }}</span>
<span style="font: var(--tt-text-caption); color: var(--tt-text-3)">{{ previewNote }}</span>
</div>
<span style="font: var(--tt-text-caption-strong); color: var(--tt-text-2)">将运行的命令</span>
<div style="display: flex; align-items: center; gap: 4px; min-height: 36px; padding: 4px 4px 4px 10px; border-radius: var(--tt-radius-md); background: var(--tt-surface-1); border: 1px solid var(--tt-border)">
<code style="flex: 1; min-width: 0; font: var(--tt-mono-md); word-break: break-all">{{ cmd }}</code>
<button type="button" class="tt-h-ghost" aria-label="复制命令" title="复制" style="width: 28px; height: 28px; flex: none; display: inline-grid; place-items: center; border: 0; border-radius: var(--tt-radius-md); background: transparent; color: var(--tt-text-2)"><svg class="tt-i" width="16" height="16" sc-camel-view-box="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg></button>
</div>
<span style="font: var(--tt-text-caption-strong); color: var(--tt-text-2)">变化</span>
<sc-if value="{{ changed }}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 8px; font: var(--tt-text-sm)">
<span style="color: var(--tt-text-2)">决策端</span>
<span style="padding: 2px 6px; border-radius: var(--tt-radius-sm); background: var(--tt-diff-del); font: var(--tt-mono-sm)">− 已配置 · 一审前、终审前 · 超时 60 秒</span>
<span></span>
<span style="padding: 2px 6px; border-radius: var(--tt-radius-sm); background: var(--tt-diff-add); font: var(--tt-mono-sm)">+ {{ afterText }}</span>
</div>
<sc-if value="{{ on }}" hint-placeholder-val="{{ true }}"><div style="display: flex; gap: 8px; padding: 10px 12px; border-radius: var(--tt-radius-md); background: var(--tt-tone-warning-bg); color: var(--tt-tone-warning-fg); font: var(--tt-text-sm)"><svg class="tt-i" width="16" height="16" sc-camel-view-box="0 0 24 24" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg><span>凭据 <code style="font: var(--tt-mono-sm)">TYPESAFE_API_KEY</code> 还没录入：保存后仍会跳过决策端，直到在凭据页录入。正在跑的 attempt 不受影响。</span></div></sc-if>
</sc-if>
<sc-if value="{{ unchanged }}" hint-placeholder-val="{{ false }}">
<span style="font: var(--tt-text-sm); color: var(--tt-text-3)">没有变化：和现在的配置一样。</span>
</sc-if>
</div>

</div>
<div style="display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--tt-border)">
<sc-if value="{{ editing }}" hint-placeholder-val="{{ true }}"><div style="display: flex; gap: 8px">
<a href="Roles.dc.html" class="tt-h-secondary" style="height: 32px; display: inline-flex; align-items: center; padding: 0 16px; border: 1px solid var(--tt-border-strong); border-radius: var(--tt-radius-md); background: var(--tt-surface-1); color: var(--tt-text-1); text-decoration: none; font: var(--tt-text-md-medium)">取消</a>
<sc-if value="{{ changed }}" hint-placeholder-val="{{ true }}"><button type="button" class="tt-h-primary" sc-camel-on-click="{{ next }}" title="打开确认框，显示将运行的命令" style="height: 32px; padding: 0 16px; border: 0; border-radius: var(--tt-radius-md); background: var(--tt-primary); color: var(--tt-on-primary); font: var(--tt-text-md-medium)">保存…</button></sc-if>
<sc-if value="{{ unchanged }}" hint-placeholder-val="{{ false }}"><button type="button" disabled="" style="height: 32px; padding: 0 16px; border: 1px solid var(--tt-border); border-radius: var(--tt-radius-md); background: var(--tt-surface-2); color: var(--tt-text-disabled); font: var(--tt-text-md-medium)">保存…</button></sc-if>
</div></sc-if>
<sc-if value="{{ confirming }}" hint-placeholder-val="{{ false }}"><div style="display: flex; gap: 8px">
<button type="button" class="tt-h-secondary" sc-camel-on-click="{{ back }}" style="height: 32px; display: inline-flex; align-items: center; padding: 0 16px; border: 1px solid var(--tt-border-strong); border-radius: var(--tt-radius-md); background: var(--tt-surface-1); color: var(--tt-text-1); text-decoration: none; font: var(--tt-text-md-medium)">取消</button>
<a href="Roles.dc.html" class="tt-h-primary" style="height: 32px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: var(--tt-radius-md); background: var(--tt-primary); color: var(--tt-on-primary); text-decoration: none; font: var(--tt-text-md-medium)">确认保存</a>
</div></sc-if>
</div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;section&quot;:&quot;外观&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:960}}">
class Component extends DCLogic {
  state = { on: true, c1: true, c2: true, step: 'edit' };

  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const st = this.state || {};
    const on = st.on !== false, c1 = st.c1 !== false, c2 = !!st.c2;
    const changed = !(on && c1 && c2);
    const confirming = st.step === 'confirm';
    const stages = [c1 ? '一审前' : null, c2 ? '终审前' : null].filter(Boolean);
    const seg = (sel) => ({ bg: sel ? 'var(--tt-surface-1)' : 'transparent', sh: sel ? 'var(--tt-shadow-1)' : 'none' });
    return {
      themeClass: theme === 'dark' ? 'tt-theme-dark' : 'tt-theme-light',
      on: on, off: !on,
      onBg: seg(on).bg, onSh: seg(on).sh, offBg: seg(!on).bg, offSh: seg(!on).sh,
      setOn: () => this.setState({ on: true }), setOff: () => this.setState({ on: false }),
      c1: c1, c2: c2,
      toggle_c1: () => this.setState({ c1: !c1 }), toggle_c2: () => this.setState({ c2: !c2 }),
      changed: changed, unchanged: !changed,
      afterText: on ? ('已配置 · ' + (stages.length ? stages.join('、') : '不在任何一处调用') + ' · 超时 60 秒') : '不启用（协调人直接移交审核端）',
      editing: !confirming, confirming: confirming,
      title: confirming ? (on ? '更新决策端的配置？' : '停用决策端？') : '配置决策端（JEV）',
      previewTitle: confirming ? '确认前核对' : '预览',
      previewNote: confirming ? '确认号 c-9j2wd · 60 秒内有效' : '--dry-run 的结果，随选择实时更新',
      next: () => this.setState({ step: 'confirm' }),
      back: () => this.setState({ step: 'edit' }),
      cmd: on ? ('bash scripts/dispatch-pi.sh config jev set --enabled --stages ' + ([c1 ? 'contract' : null, c2 ? 'final' : null].filter(Boolean).join(',') || 'none') + ' --timeout 60') : 'bash scripts/dispatch-pi.sh config jev set --disabled'
    };
  }
}
</script>


</body></html>
