<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<title>总览 · 浅色</title>
<script src="6efdd1a3-6cce-4d81-8353-d2c37efe0d04"></script>
<style>/* Themis Tally 设计令牌（tokens.css）
   依据《Themis Tally 桌面端界面设计》第 3 节；2026-10-19 修订：
   - 缺省主题为暗色（亮色写 data-theme="light" 或 .tt-theme-light；跟随系统写 data-theme="system"）；
   - 中英文统一用等宽字体「等距更纱黑体 SC / Sarasa Mono SC」（SIL OFL 1.1），1 个汉字 = 2 个英文字符宽。
   画布里用的是只含本稿用字的子集；应用里随包打包完整字体文件。 */

@font-face {
  font-family: "TT Sarasa Mono SC";
  src: url("ddc0de6d-57e5-46c4-a30d-b4849f5bfc94") format("woff2");
  font-weight: 300 500;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "TT Sarasa Mono SC";
  src: url("1aa447bc-9af1-435f-a0bf-023e171aab04") format("woff2");
  font-weight: 600 800;
  font-style: normal;
  font-display: swap;
}

:root {
  /* 3.1 原色 · 海军蓝 */
  --tt-navy-50: #F0F4FA; --tt-navy-100: #DDE6F2; --tt-navy-200: #BACCE4; --tt-navy-300: #8FA9CF;
  --tt-navy-400: #5C80B4; --tt-navy-500: #355E97; --tt-navy-600: #1E4679; --tt-navy-700: #0F3563;
  --tt-navy-800: #012852; --tt-navy-900: #011D3D; --tt-navy-950: #00112A;
  /* 符契金 */
  --tt-gold-50: #FCF7EC; --tt-gold-100: #F8EBD0; --tt-gold-200: #F0D6A0; --tt-gold-300: #E7BF6E;
  --tt-gold-400: #DDAA48; --tt-gold-500: #D49C32; --tt-gold-600: #B5801F; --tt-gold-700: #8E6418;
  --tt-gold-800: #694A13; --tt-gold-900: #46320E;
  /* 冷灰 */
  --tt-gray-0: #FFFFFF; --tt-gray-25: #F9FAFC; --tt-gray-50: #F3F5F9; --tt-gray-100: #E8ECF2;
  --tt-gray-200: #D5DBE5; --tt-gray-300: #B7C0CE; --tt-gray-400: #8F9AAD; --tt-gray-500: #6A7589;
  --tt-gray-600: #4F596C; --tt-gray-700: #3A4354; --tt-gray-800: #262E3C; --tt-gray-850: #1C2330;
  --tt-gray-900: #141A25; --tt-gray-950: #0C111A;

  /* 3.6 字体：中英文统一等宽 */
  --tt-font-sans: "TT Sarasa Mono SC", "Sarasa Mono SC", "等距更纱黑体 SC", "Sarasa Term SC", "Maple Mono NF CN", "Cascadia Mono", "Noto Sans Mono CJK SC", monospace;
  --tt-font-mono: var(--tt-font-sans);
  --tt-text-caption: 400 12px/16px var(--tt-font-sans);
  --tt-text-caption-strong: 600 12px/16px var(--tt-font-sans);
  --tt-text-sm: 400 13px/20px var(--tt-font-sans);
  --tt-text-sm-medium: 500 13px/20px var(--tt-font-sans);
  --tt-text-md: 400 14px/22px var(--tt-font-sans);
  --tt-text-md-medium: 500 14px/22px var(--tt-font-sans);
  --tt-text-lg: 400 16px/24px var(--tt-font-sans);
  --tt-title-sm: 600 14px/22px var(--tt-font-sans);
  --tt-title-md: 600 16px/24px var(--tt-font-sans);
  --tt-title-lg: 600 20px/28px var(--tt-font-sans);
  --tt-display: 600 28px/36px var(--tt-font-sans);
  --tt-mono-sm: 400 12px/18px var(--tt-font-mono);
  --tt-mono-md: 400 13px/20px var(--tt-font-mono);

  /* 3.7 间距 */
  --tt-space-0_5: 2px; --tt-space-1: 4px; --tt-space-2: 8px; --tt-space-3: 12px; --tt-space-4: 16px;
  --tt-space-5: 20px; --tt-space-6: 24px; --tt-space-8: 32px; --tt-space-10: 40px; --tt-space-12: 48px; --tt-space-16: 64px;
  /* 圆角 */
  --tt-radius-sm: 4px; --tt-radius-md: 6px; --tt-radius-lg: 8px; --tt-radius-xl: 12px; --tt-radius-full: 999px;
  /* 时长与缓动 */
  --tt-duration-fast: 100ms; --tt-duration-base: 160ms; --tt-duration-slow: 220ms;
  --tt-ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --tt-ease-exit: cubic-bezier(0.4, 0, 1, 1);
  /* 层级 */
  --tt-z-sticky: 10; --tt-z-popover: 100; --tt-z-drawer: 200; --tt-z-dialog: 300; --tt-z-toast: 400; --tt-z-tooltip: 500;
  /* 框架：底部标签栏 */
  --tt-tabbar-height: 56px;
}

/* 3.2 / 3.3 语义色 · 暗色（缺省） */
:root, .tt-theme-dark {
  color-scheme: dark;
  --tt-bg: #0C111A;
  --tt-surface-1: #141A25;
  --tt-surface-2: #1C2330;
  --tt-surface-3: #262E3C;
  --tt-surface-selected: #0F2A4D;
  --tt-titlebar: #141A25;
  --tt-sidebar: #00112A;
  --tt-sidebar-hover: #0F2A4D;
  --tt-sidebar-text: #DDE6F2;
  --tt-sidebar-text-muted: #8FA9CF;
  --tt-sidebar-text-active: #FFFFFF;
  --tt-sidebar-dot-info: #67E8F9;
  --tt-text-1: #E8ECF2;
  --tt-text-2: #B7C0CE;
  --tt-text-3: #8F9AAD;
  --tt-text-disabled: #5A6478;
  --tt-border: #262E3C;
  --tt-border-strong: #677186;
  --tt-primary: #8FA9CF;
  --tt-primary-hover: #BACCE4;
  --tt-primary-active: #DDE6F2;
  --tt-on-primary: #00112A;
  --tt-link: #8FA9CF;
  --tt-accent: #DDAA48;
  --tt-accent-text: #E7BF6E;
  --tt-on-accent: #00112A;
  --tt-focus: #DDAA48;
  --tt-danger: #B91C1C;
  --tt-on-danger: #FFFFFF;
  --tt-danger-text: #FCA5A5;
  --tt-diff-add: #12301F;
  --tt-diff-del: #3A1414;
  --tt-highlight: #3A2C10;
  --tt-scrim: rgba(0, 0, 0, 0.60);
  --tt-shadow-1: 0 1px 2px rgba(0, 0, 0, .40);
  --tt-shadow-2: 0 4px 12px rgba(0, 0, 0, .50);
  --tt-shadow-3: 0 16px 40px rgba(0, 0, 0, .60);
  --tt-logo-mark: #DDE6F2;
  --tt-logo-tally: #D49C32;
  --tt-tone-neutral-bg: #262E3C;   --tt-tone-neutral-fg: #D5DBE5;
  --tt-tone-info-bg: #0F2E38;      --tt-tone-info-fg: #67E8F9;
  --tt-tone-attention-bg: #3A2C10; --tt-tone-attention-fg: #F0D6A0;
  --tt-tone-success-bg: #12301F;   --tt-tone-success-fg: #86EFAC;
  --tt-tone-warning-bg: #3B1D0C;   --tt-tone-warning-fg: #FDBA74;
  --tt-tone-danger-bg: #3A1414;    --tt-tone-danger-fg: #FCA5A5;
  --tt-tone-escalate-bg: #2A1B4A;  --tt-tone-escalate-fg: #C4B5FD;
  --tt-tone-brand-bg: #0F2A4D;     --tt-tone-brand-fg: #BACCE4;
}

/* 亮色 */
:root[data-theme="light"], .tt-theme-light {
  color-scheme: light;
  --tt-bg: #F3F5F9;
  --tt-surface-1: #FFFFFF;
  --tt-surface-2: #F9FAFC;
  --tt-surface-3: #E8ECF2;
  --tt-surface-selected: #F0F4FA;
  --tt-titlebar: #FFFFFF;
  --tt-sidebar: #012852;
  --tt-sidebar-hover: #0F3563;
  --tt-sidebar-text: #DDE6F2;
  --tt-sidebar-text-muted: #8FA9CF;
  --tt-sidebar-text-active: #FFFFFF;
  --tt-sidebar-dot-info: #67E8F9;
  --tt-text-1: #141A25;
  --tt-text-2: #4F596C;
  --tt-text-3: #636E82;
  --tt-text-disabled: #8F9AAD;
  --tt-border: #D5DBE5;
  --tt-border-strong: #808B9E;
  --tt-primary: #012852;
  --tt-primary-hover: #0F3563;
  --tt-primary-active: #011D3D;
  --tt-on-primary: #FFFFFF;
  --tt-link: #1E4679;
  --tt-accent: #D49C32;
  --tt-accent-text: #8E6418;
  --tt-on-accent: #00112A;
  --tt-focus: #355E97;
  --tt-danger: #B91C1C;
  --tt-on-danger: #FFFFFF;
  --tt-danger-text: #991B1B;
  --tt-diff-add: #E3F4E8;
  --tt-diff-del: #FCE4E4;
  --tt-highlight: #F8EBD0;
  --tt-scrim: rgba(12, 17, 26, 0.45);
  --tt-shadow-1: 0 1px 2px rgba(1, 40, 82, .06);
  --tt-shadow-2: 0 4px 12px rgba(1, 40, 82, .10), 0 1px 3px rgba(1, 40, 82, .06);
  --tt-shadow-3: 0 16px 40px rgba(1, 40, 82, .18);
  --tt-logo-mark: #012852;
  --tt-logo-tally: #D49C32;
  --tt-tone-neutral-bg: #E8ECF2;   --tt-tone-neutral-fg: #3A4354;
  --tt-tone-info-bg: #DDF1F5;      --tt-tone-info-fg: #0B5566;
  --tt-tone-attention-bg: #F8EBD0; --tt-tone-attention-fg: #5E420F;
  --tt-tone-success-bg: #E3F4E8;   --tt-tone-success-fg: #136A34;
  --tt-tone-warning-bg: #FDEBDD;   --tt-tone-warning-fg: #9A3412;
  --tt-tone-danger-bg: #FCE4E4;    --tt-tone-danger-fg: #991B1B;
  --tt-tone-escalate-bg: #EFE7FD;  --tt-tone-escalate-fg: #5B21B6;
  --tt-tone-brand-bg: #DDE6F2;     --tt-tone-brand-fg: #012852;
}

/* 跟随系统：写 data-theme="system" 时，系统为亮色就用亮色 */
@media (prefers-color-scheme: light) {
  :root[data-theme="system"] {
    color-scheme: light;
    --tt-bg: #F3F5F9; --tt-surface-1: #FFFFFF; --tt-surface-2: #F9FAFC; --tt-surface-3: #E8ECF2;
    --tt-surface-selected: #F0F4FA; --tt-titlebar: #FFFFFF; --tt-sidebar: #012852; --tt-sidebar-hover: #0F3563;
    --tt-text-1: #141A25; --tt-text-2: #4F596C; --tt-text-3: #636E82; --tt-text-disabled: #8F9AAD;
    --tt-border: #D5DBE5; --tt-border-strong: #808B9E;
    --tt-primary: #012852; --tt-primary-hover: #0F3563; --tt-primary-active: #011D3D; --tt-on-primary: #FFFFFF;
    --tt-link: #1E4679; --tt-accent: #D49C32; --tt-accent-text: #8E6418; --tt-focus: #355E97;
    --tt-danger-text: #991B1B; --tt-diff-add: #E3F4E8; --tt-diff-del: #FCE4E4; --tt-highlight: #F8EBD0;
    --tt-scrim: rgba(12, 17, 26, 0.45);
    --tt-shadow-1: 0 1px 2px rgba(1, 40, 82, .06); --tt-shadow-2: 0 4px 12px rgba(1, 40, 82, .10), 0 1px 3px rgba(1, 40, 82, .06); --tt-shadow-3: 0 16px 40px rgba(1, 40, 82, .18);
    --tt-logo-mark: #012852;
    --tt-tone-neutral-bg: #E8ECF2; --tt-tone-neutral-fg: #3A4354; --tt-tone-info-bg: #DDF1F5; --tt-tone-info-fg: #0B5566;
    --tt-tone-attention-bg: #F8EBD0; --tt-tone-attention-fg: #5E420F; --tt-tone-success-bg: #E3F4E8; --tt-tone-success-fg: #136A34;
    --tt-tone-warning-bg: #FDEBDD; --tt-tone-warning-fg: #9A3412; --tt-tone-danger-bg: #FCE4E4; --tt-tone-danger-fg: #991B1B;
    --tt-tone-escalate-bg: #EFE7FD; --tt-tone-escalate-fg: #5B21B6; --tt-tone-brand-bg: #DDE6F2; --tt-tone-brand-fg: #012852;
  }
}

/* 减少动态效果 */
@media (prefers-reduced-motion: reduce) {
  :root { --tt-duration-fast: 0ms; --tt-duration-base: 0ms; --tt-duration-slow: 0ms; }
}

/* ---------- 基础 ---------- */
.tt-app {
  font: var(--tt-text-md);
  color: var(--tt-text-1);
  background: var(--tt-bg);
  -webkit-font-smoothing: antialiased;
  font-variant-ligatures: none;
}
.tt-app *, .tt-app *::before, .tt-app *::after { box-sizing: border-box; }
.tt-app button, .tt-app input, .tt-app select, .tt-app textarea { font: inherit; color: inherit; margin: 0; }
.tt-app button { cursor: pointer; }
.tt-app button:disabled { cursor: not-allowed; }
.tt-app a { color: var(--tt-link); }
.tt-app table { border-collapse: collapse; border-spacing: 0; }
.tt-app input::placeholder { color: var(--tt-text-3); }
.tt-num { font-variant-numeric: tabular-nums; }
.tt-i { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* 焦点：2px 焦点环，外偏 2px（:focus-visible） */
.tt-app :focus-visible { outline: 2px solid var(--tt-focus); outline-offset: 2px; }
.tt-app input:focus-visible, .tt-app select:focus-visible, .tt-app textarea:focus-visible { border-color: var(--tt-focus) !important; outline-offset: 1px; }

/* 悬停与按下（内联样式之上，需 !important） */
.tt-h-primary:hover:not(:disabled) { background: var(--tt-primary-hover) !important; }
.tt-h-primary:active:not(:disabled) { background: var(--tt-primary-active) !important; }
.tt-h-secondary:hover:not(:disabled) { background: var(--tt-surface-2) !important; }
.tt-h-secondary:active:not(:disabled) { background: var(--tt-surface-3) !important; }
.tt-h-ghost:hover:not(:disabled) { background: var(--tt-surface-3) !important; }
.tt-h-danger:hover:not(:disabled) { filter: brightness(0.9); }
.tt-h-nav:hover { background: var(--tt-sidebar-hover) !important; }
.tt-h-row:hover { background: var(--tt-surface-3) !important; }
.tt-h-underline:hover { text-decoration: underline !important; }

/* 动效：只用于状态变化与展开收起 */
@keyframes tt-spin { to { transform: rotate(360deg); } }
.tt-spin { animation: tt-spin 1s linear infinite; transform-origin: 50% 50%; }
@keyframes tt-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
.tt-skel { animation: tt-pulse 1.6s var(--tt-ease-standard) infinite; }
@keyframes tt-indeterminate { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
.tt-indet { animation: tt-indeterminate 1.4s var(--tt-ease-standard) infinite; }
@keyframes tt-enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.tt-enter { animation: tt-enter var(--tt-duration-slow) var(--tt-ease-standard); }
@keyframes tt-drawer-in { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.tt-drawer-in { animation: tt-drawer-in var(--tt-duration-slow) var(--tt-ease-standard); }
@media (prefers-reduced-motion: reduce) {
  .tt-spin, .tt-skel, .tt-indet, .tt-enter, .tt-drawer-in { animation: none; }
}

/* 窄内容区（内容宽度 < 760）：容器查询，不用视口宽度 */
.tt-content { container-type: inline-size; container-name: tt-content; }
@container tt-content (max-width: 807px) {
  .tt-pad { padding: 16px !important; }
  .tt-grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .tt-grid-2 { grid-template-columns: minmax(0, 1fr) !important; }
  .tt-stack-narrow { flex-direction: column !important; align-items: stretch !important; }
  .tt-w-narrow-full { width: auto !important; flex: none !important; }
}
/* 底部标签栏在窄窗口（< 1180）时只保留计数，隐藏“上次更新”与 kit 版本 */
@media (max-width: 1179px) {
  .tt-hide-narrow { display: none !important; }
}

/* Windows 高对比度 */
@media (forced-colors: active) {
  .tt-app :focus-visible { outline-color: Highlight; }
  .tt-fc { border: 1px solid CanvasText !important; }
}
</style>
</head>

<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="tt-theme-light" style="min-height: 100vh; background: var(--tt-bg)">

</div>
